<mat-toolbar color="primary">
  <button mat-icon-button (click)="back.emit()" aria-label="Retour">
    <mat-icon>arrow_back</mat-icon>
  </button>
  <span>Paramètres</span>
</mat-toolbar>

<div class="settings-page">
  <mat-card>
    <mat-card-content>
      <p class="hint">
        Les paramètres SMTP (hôte, port, identifiants) sont configurés côté serveur via les
        variables d'environnement Vercel. Ici, tu choisis simplement les valeurs par défaut
        proposées au moment d'envoyer une photo.
      </p>

      <form class="form" (ngSubmit)="save()">
        <mat-form-field appearance="outline">
          <mat-label>Destinataire par défaut</mat-label>
          <input
            matInput
            type="email"
            [ngModel]="model().defaultTo"
            name="defaultTo"
            (ngModelChange)="update('defaultTo', $event)"
          />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Nom affiché (expéditeur)</mat-label>
          <input
            matInput
            [ngModel]="model().fromName"
            name="fromName"
            (ngModelChange)="update('fromName', $event)"
          />
        </mat-form-field>

        <div class="actions">
          <button mat-button type="button" (click)="back.emit()">Annuler</button>
          <button mat-flat-button color="primary" type="submit">Enregistrer</button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
