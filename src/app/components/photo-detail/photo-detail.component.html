<mat-toolbar color="primary">
  <button mat-icon-button (click)="back.emit()" aria-label="Retour">
    <mat-icon>arrow_back</mat-icon>
  </button>
  <span>Photo</span>
</mat-toolbar>

<div class="detail-page">
  <div class="image-wrap">
    <img [src]="imageUrl()" alt="Photo" />
  </div>

  <p class="date">{{ photo.createdAt | date: 'dd/MM/yyyy HH:mm' }}</p>

  <div class="detail-actions">
    <button mat-stroked-button color="warn" (click)="delete()">
      <mat-icon>delete</mat-icon>
      Supprimer
    </button>
    <button mat-flat-button color="primary" (click)="openEmail()">
      <mat-icon>mail</mat-icon>
      Envoyer par email
    </button>
  </div>
</div>
