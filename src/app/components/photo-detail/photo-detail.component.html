<mat-toolbar color="primary">
  <button mat-icon-button (click)="back.emit()" aria-label="Retour">
    <mat-icon>arrow_back</mat-icon>
  </button>
</mat-toolbar>

<div class="detail-page">
  <div class="image-wrap">
    <img [src]="imageUrl()" alt="Photo" />
  </div>

  <div class="detail-actions">
    <button mat-flat-button color="primary" (click)="saveOrShare()">
      <mat-icon>ios_share</mat-icon>
      Enregistrer ou Partager
    </button>
    <button mat-stroked-button color="warn" class="delete-btn" (click)="delete()">
      <mat-icon>delete</mat-icon>
      Supprimer
    </button>
  </div>
</div>
