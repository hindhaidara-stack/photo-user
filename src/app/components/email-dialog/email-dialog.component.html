<h2 mat-dialog-title>Envoyer la photo par email</h2>
<mat-dialog-content class="email-form">
  <mat-form-field appearance="outline">
    <mat-label>Destinataire</mat-label>
    <input
      matInput
      type="email"
      placeholder="ex@email.com"
      [ngModel]="to()"
      (ngModelChange)="to.set($event)"
      [disabled]="sending()"
      required
    />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Sujet</mat-label>
    <input
      matInput
      [ngModel]="subject()"
      (ngModelChange)="subject.set($event)"
      [disabled]="sending()"
    />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Message</mat-label>
    <textarea
      matInput
      rows="3"
      [ngModel]="message()"
      (ngModelChange)="message.set($event)"
      [disabled]="sending()"
    ></textarea>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()" [disabled]="sending()">Annuler</button>
  <button mat-flat-button color="primary" (click)="send()" [disabled]="sending()">
    @if (sending()) {
      <mat-progress-spinner mode="indeterminate" diameter="20"></mat-progress-spinner>
    } @else {
      Envoyer
    }
  </button>
</mat-dialog-actions>
