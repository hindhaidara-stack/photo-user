@switch (view()) {
  @case ('home') {
    @if (canInstall()) {
      <mat-toolbar color="primary">
        <span class="spacer"></span>
        <button mat-icon-button (click)="install()" aria-label="Installer l'application">
          <mat-icon>install_mobile</mat-icon>
        </button>
      </mat-toolbar>
    }
    <app-home (takePhoto)="openCamera()" (openPhoto)="openPhoto($event)" />
  }
  @case ('camera') {
    <app-camera (captured)="onCaptured($event)" (closed)="onCameraClosed()" />
  }
  @case ('detail') {
    @if (selectedPhoto(); as photo) {
      <app-photo-detail [photo]="photo" (back)="backToHome()" />
    }
  }
}
